<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NipponAuto Uganda</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f0a500'/><text y='24' x='4' font-size='22'>🚗</text></svg>" />
  <style>
    /* ---- Base ---- */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}

    /* ---- Background — subtle dot grid over gradient ---- */
    .login-page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem 1rem;
      background-color:#0a1628;
      background-image:
        radial-gradient(circle at 70% 20%, rgba(240,165,0,.12) 0%, transparent 55%),
        radial-gradient(circle at 20% 80%, rgba(26,50,89,.8) 0%, transparent 55%),
        radial-gradient(#ffffff0d 1px, transparent 1px);
      background-size:auto,auto,28px 28px;
    }

    /* ---- Card ---- */
    .login-box{
      background:#fff;
      border-radius:20px;
      padding:2.75rem 2.5rem;
      width:100%;
      max-width:440px;
      box-shadow:0 24px 80px rgba(0,0,0,.38),0 8px 24px rgba(0,0,0,.18);
    }

    /* ---- Brand ---- */
    .login-brand{display:flex;align-items:center;gap:.8rem;margin-bottom:2rem;justify-content:center;}
    .login-brand-icon{font-size:2.4rem;}
    .login-brand-text span{display:block;line-height:1.15;}
    .login-brand-text .t1{font-size:1.3rem;font-weight:800;color:#0a1628;letter-spacing:-.02em;}
    .login-brand-text .t2{font-size:.78rem;font-weight:600;color:#f0a500;text-transform:uppercase;letter-spacing:.06em;}

    /* ---- Heading ---- */
    .login-box h2{font-size:1.45rem;font-weight:800;color:#0a1628;margin-bottom:.3rem;text-align:center;letter-spacing:-.02em;}
    .login-box .sub{color:#8a9ab5;font-size:.88rem;text-align:center;margin-bottom:1.85rem;}

    /* ---- Pill tab switcher ---- */
    .login-tabs{
      display:flex;
      gap:.4rem;
      margin-bottom:1.75rem;
      background:#f0f2f8;
      border-radius:50px;
      padding:.3rem;
    }
    .login-tab{
      flex:1;
      padding:.55rem .5rem;
      border:none;
      background:transparent;
      border-radius:50px;
      font-size:.84rem;
      font-weight:600;
      cursor:pointer;
      color:#8a9ab5;
      transition:all .25s ease;
      font-family:inherit;
    }
    .login-tab.active{
      background:#0a1628;
      color:#fff;
      box-shadow:0 2px 10px rgba(10,22,40,.3);
    }
    .login-tab:not(.active):hover{color:#0a1628;}

    /* ---- Form fields ---- */
    .lf-group{margin-bottom:1.1rem;}
    .lf-group label{display:block;font-size:.78rem;font-weight:700;color:#1e2a3a;margin-bottom:.42rem;letter-spacing:.01em;}
    .lf-group input{
      width:100%;
      padding:.8rem 1rem;
      border:1.5px solid #d1d9e6;
      border-radius:10px;
      font-size:.9rem;
      outline:none;
      transition:border-color .2s,box-shadow .2s;
      font-family:inherit;
      box-sizing:border-box;
      background:#fafbfd;
      color:#1e2a3a;
    }
    .lf-group input:focus{
      border-color:#0a1628;
      background:#fff;
      box-shadow:0 0 0 3px rgba(10,22,40,.08);
    }

    /* ---- Error alert ---- */
    .login-error{
      background:#fef2f2;
      color:#b91c1c;
      border:1px solid #fecaca;
      border-left:4px solid #dc2626;
      border-radius:8px;
      padding:.7rem 1rem;
      font-size:.83rem;
      margin-bottom:1.1rem;
      display:none;
    }

    /* ---- Submit button — gradient with glow ---- */
    .btn-login-submit{
      width:100%;
      padding:.85rem;
      background:linear-gradient(135deg,#c0392b 0%,#e74c3c 100%);
      color:#fff;
      border:none;
      border-radius:10px;
      font-size:.95rem;
      font-weight:700;
      cursor:pointer;
      transition:all .25s ease;
      font-family:inherit;
      margin-top:.35rem;
      box-shadow:0 4px 14px rgba(192,57,43,.35);
      letter-spacing:.01em;
    }
    .btn-login-submit:hover{
      background:linear-gradient(135deg,#a93226 0%,#c0392b 100%);
      box-shadow:0 6px 22px rgba(192,57,43,.55);
      transform:translateY(-1px);
    }
    .btn-login-submit:active{transform:translateY(0);box-shadow:0 2px 8px rgba(192,57,43,.3);}

    /* ---- Hint box ---- */
    .login-hint{
      background:#f0f9ff;
      border:1px solid #bae6fd;
      border-radius:8px;
      padding:.65rem 1rem;
      font-size:.78rem;
      color:#0369a1;
      margin-top:.85rem;
      display:none;
    }
    .login-hint.show{display:block;}

    /* ---- Signup link row ---- */
    #signupLinkWrap{text-align:center;margin-top:1rem;font-size:.84rem;color:#8a9ab5;}
    #signupLinkWrap a{color:#c0392b;font-weight:700;text-decoration:none;}
    #signupLinkWrap a:hover{text-decoration:underline;}

    /* ---- Back link ---- */
    .login-back{
      display:block;
      text-align:center;
      margin-top:1.35rem;
      color:#8a9ab5;
      font-size:.82rem;
      text-decoration:none;
      transition:color .2s;
    }
    .login-back:hover{color:#0a1628;}

    @media(max-width:480px){
      .login-box{padding:2rem 1.5rem;border-radius:16px;}
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon">🚗</div>
      <div class="login-brand-text">
        <span class="t1">NipponAuto Uganda</span>
        <span class="t2">Account Portal</span>
      </div>
    </div>
    <h2>Welcome Back</h2>
    <p class="sub">Sign in to your account</p>
    <div class="login-tabs">
      <button class="login-tab active" id="tabCustomer" onclick="switchTab('customer')">Customer</button>
      <button class="login-tab" id="tabAdmin" onclick="switchTab('admin')">Staff / Admin</button>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="lf-group">
      <label id="userLabel">Email Address</label>
      <input type="text" id="loginUser" placeholder="your@email.com" autocomplete="username" />
    </div>
    <div class="lf-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-login-submit" id="loginBtn">Sign In</button>
    <div class="login-hint" id="loginHint"></div>
    <div id="signupLinkWrap" style="text-align:center;margin-top:.9rem;font-size:.84rem;color:#8a9ab5;">
      Don't have an account? <a href="signup.html" style="color:#c0392b;font-weight:600;text-decoration:none;">Sign up →</a>
    </div>
    <a href="index.html" class="login-back">← Back to NipponAuto Uganda</a>
  </div>
</div>
<script>
var currentTab='customer';
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tabCustomer').className='login-tab'+(tab==='customer'?' active':'');
  document.getElementById('tabAdmin').className='login-tab'+(tab==='admin'?' active':'');
  document.getElementById('loginUser').placeholder=tab==='admin'?'admin':'your@email.com';
  document.getElementById('userLabel').textContent=tab==='admin'?'Username':'Email Address';
  document.getElementById('loginError').style.display='none';
  document.getElementById('signupLinkWrap').style.display=tab==='customer'?'block':'none';
  var hint=document.getElementById('loginHint');
  if(tab==='customer'){hint.className='login-hint show';hint.textContent='Demo: email = customer@nipponauto.ug | password = customer123';}
  else{hint.className='login-hint show';hint.textContent='Staff access: use your admin credentials';}
}
function attemptLogin(){
  var user=document.getElementById('loginUser').value.trim();
  var pass=document.getElementById('loginPass').value;
  var err=document.getElementById('loginError');
  err.style.display='none';
  if(!user||!pass){err.textContent='Please enter both username and password.';err.style.display='block';return;}
  if(currentTab==='admin'){
    if(user==='admin'&&pass==='nippon2025'){sessionStorage.setItem('nau_session','1');window.location.href='admin/';}
    else{err.textContent='Invalid admin credentials.';err.style.display='block';}
    return;
  }
  var customers;
  try{customers=JSON.parse(localStorage.getItem('nau_customers')||'[]');}catch(e){customers=[];}
  if(!customers.length){
    customers=[{id:1,name:'John Mugisha',email:'customer@nipponauto.ug',phone:'+256 700 100 200',password:'customer123',createdAt:'2026-01-15'},{id:2,name:'Grace Nakato',email:'grace@nipponauto.ug',phone:'+256 700 300 400',password:'grace456',createdAt:'2026-02-10'}];
    localStorage.setItem('nau_customers',JSON.stringify(customers));
  }
  var found=customers.find(function(c){return c.email.toLowerCase()===user.toLowerCase()&&c.password===pass;});
  if(found){sessionStorage.setItem('nau_customer_session',JSON.stringify({id:found.id,name:found.name,email:found.email,phone:found.phone}));window.location.href='customer/';}
  else{err.textContent='Invalid email or password.';err.style.display='block';}
}
document.getElementById('loginBtn').addEventListener('click',attemptLogin);
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')attemptLogin();});
switchTab('customer');
</script>
</body>
</html>
