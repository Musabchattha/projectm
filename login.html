<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NipponAuto Uganda</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f0a500'/><text y='24' x='4' font-size='22'>🚗</text></svg>" />
  <style>
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a1628 0%,#1a3259 60%,#0a1628 100%);padding:1rem;}
    .login-box{background:#fff;border-radius:14px;padding:2.5rem 2rem;width:100%;max-width:420px;box-shadow:0 12px 48px rgba(0,0,0,.3);}
    .login-brand{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;justify-content:center;}
    .login-brand-icon{font-size:2.2rem;}
    .login-brand-text span{display:block;line-height:1.15;}
    .login-brand-text .t1{font-size:1.25rem;font-weight:800;color:#0a1628;}
    .login-brand-text .t2{font-size:.82rem;color:#8a9ab5;}
    .login-box h2{font-size:1.35rem;color:#0a1628;margin-bottom:.3rem;text-align:center;}
    .login-box .sub{color:#8a9ab5;font-size:.87rem;text-align:center;margin-bottom:1.75rem;}
    .login-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;background:#f4f6fa;border-radius:8px;padding:.3rem;}
    .login-tab{flex:1;padding:.55rem;border:none;background:transparent;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;color:#8a9ab5;transition:all .2s;font-family:inherit;}
    .login-tab.active{background:#fff;color:#0a1628;box-shadow:0 1px 4px rgba(0,0,0,.1);}
    .lf-group{margin-bottom:1rem;}
    .lf-group label{display:block;font-size:.8rem;font-weight:600;color:#1e2a3a;margin-bottom:.35rem;}
    .lf-group input{width:100%;padding:.65rem .9rem;border:1.5px solid #d1d9e6;border-radius:7px;font-size:.9rem;outline:none;transition:border-color .2s;font-family:inherit;box-sizing:border-box;}
    .lf-group input:focus{border-color:#0a1628;}
    .login-error{background:#fef2f2;color:#c0392b;border:1px solid #fecaca;border-radius:6px;padding:.6rem .9rem;font-size:.83rem;margin-bottom:1rem;display:none;}
    .btn-login-submit{width:100%;padding:.75rem;background:#c0392b;color:#fff;border:none;border-radius:7px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;font-family:inherit;margin-top:.25rem;}
    .btn-login-submit:hover{background:#a93226;}
    .login-back{display:block;text-align:center;margin-top:1.25rem;color:#8a9ab5;font-size:.83rem;text-decoration:none;}
    .login-back:hover{color:#0a1628;}
    .login-hint{background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:.6rem .9rem;font-size:.78rem;color:#0369a1;margin-top:.75rem;display:none;}
    .login-hint.show{display:block;}
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-brand-icon">🚗</div>
      <div class="login-brand-text">
        <span class="t1">NipponAuto Uganda</span>
        <span class="t2">Account Portal</span>
      </div>
    </div>
    <h2>Welcome Back</h2>
    <p class="sub">Sign in to your account</p>
    <div class="login-tabs">
      <button class="login-tab active" id="tabCustomer" onclick="switchTab('customer')">Customer</button>
      <button class="login-tab" id="tabAdmin" onclick="switchTab('admin')">Staff / Admin</button>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="lf-group">
      <label id="userLabel">Email Address</label>
      <input type="text" id="loginUser" placeholder="your@email.com" autocomplete="username" />
    </div>
    <div class="lf-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-login-submit" id="loginBtn">Sign In</button>
    <div class="login-hint" id="loginHint"></div>
    <div id="signupLinkWrap" style="text-align:center;margin-top:.9rem;font-size:.84rem;color:#8a9ab5;">
      Don't have an account? <a href="signup.html" style="color:#c0392b;font-weight:600;text-decoration:none;">Sign up →</a>
    </div>
    <a href="index.html" class="login-back">← Back to NipponAuto Uganda</a>
  </div>
</div>
<script>
var currentTab='customer';
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tabCustomer').className='login-tab'+(tab==='customer'?' active':'');
  document.getElementById('tabAdmin').className='login-tab'+(tab==='admin'?' active':'');
  document.getElementById('loginUser').placeholder=tab==='admin'?'admin':'your@email.com';
  document.getElementById('userLabel').textContent=tab==='admin'?'Username':'Email Address';
  document.getElementById('loginError').style.display='none';
  document.getElementById('signupLinkWrap').style.display=tab==='customer'?'block':'none';
  var hint=document.getElementById('loginHint');
  if(tab==='customer'){hint.className='login-hint show';hint.textContent='Demo: email = customer@nipponauto.ug | password = customer123';}
  else{hint.className='login-hint show';hint.textContent='Staff access: use your admin credentials';}
}
function attemptLogin(){
  var user=document.getElementById('loginUser').value.trim();
  var pass=document.getElementById('loginPass').value;
  var err=document.getElementById('loginError');
  err.style.display='none';
  if(!user||!pass){err.textContent='Please enter both username and password.';err.style.display='block';return;}
  if(currentTab==='admin'){
    if(user==='admin'&&pass==='nippon2025'){sessionStorage.setItem('nau_session','1');window.location.href='admin/';}
    else{err.textContent='Invalid admin credentials.';err.style.display='block';}
    return;
  }
  var customers;
  try{customers=JSON.parse(localStorage.getItem('nau_customers')||'[]');}catch(e){customers=[];}
  if(!customers.length){
    customers=[{id:1,name:'John Mugisha',email:'customer@nipponauto.ug',phone:'+256 700 100 200',password:'customer123',createdAt:'2026-01-15'},{id:2,name:'Grace Nakato',email:'grace@nipponauto.ug',phone:'+256 700 300 400',password:'grace456',createdAt:'2026-02-10'}];
    localStorage.setItem('nau_customers',JSON.stringify(customers));
  }
  var found=customers.find(function(c){return c.email.toLowerCase()===user.toLowerCase()&&c.password===pass;});
  if(found){sessionStorage.setItem('nau_customer_session',JSON.stringify({id:found.id,name:found.name,email:found.email,phone:found.phone}));window.location.href='customer/';}
  else{err.textContent='Invalid email or password.';err.style.display='block';}
}
document.getElementById('loginBtn').addEventListener('click',attemptLogin);
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')attemptLogin();});
switchTab('customer');
</script>
</body>
</html>
